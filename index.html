<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ランダム質問</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 520px;
    }
    #question {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    button {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h1>ランダム質問</h1>

  <div class="card">
    <div id="question">ボタンを押すと質問が表示されます</div>
    <div class="buttons">
      <button onclick="nextQuestion()">質問を出す</button>
      <button onclick="copyQuestion()">コピー</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
