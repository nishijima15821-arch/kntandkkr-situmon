<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ランダム質問</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 24px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    .toggle {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 14px;
      cursor: pointer;
    }

    .toggle input {
      margin-right: 6px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      max-width: 520px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    #question {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>ランダム質問</h1>

  <!-- スキップOK表示 -->
  <p class="hint">※答えたくない質問はスキップOK（遠慮なく飛ばしてOK）</p>

  <!-- spicy 出現オン／オフ -->
  <label class="toggle">
    <input type="checkbox" id="toggleSpicy" checked>
    spicy を出す
  </label>

  <div class="card">
    <div id="question">ボタンを押すと質問が表示されます</div>

    <div class="buttons">
      <button onclick="nextQuestion()">質問を出す</button>
      <button onclick="copyQuestion()">コピー</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
